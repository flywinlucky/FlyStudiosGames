<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly Studios Games | Web3 Ticket Portal</title>
    <meta name="description"
        content="Fly Studios Games Web3 portal for wallet connection and blockchain raffle ticket purchases.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=Manrope:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #171717;
            --panel: #1f1f1f;
            --panel-border: #363636;
            --text: #f7f7f7;
            --muted: #b8b8b8;
            --gold: #f4c542;
            --gold-strong: #e0ae23;
            --danger: #ff7b7b;
            --success: #8ae6a2;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Manrope", sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at 10% 10%, rgba(244, 197, 66, 0.12), transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(244, 197, 66, 0.08), transparent 45%),
                linear-gradient(135deg, #121212, #1a1a1a 35%, #111111);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .portal {
            width: 100%;
            max-width: 760px;
            background: linear-gradient(160deg, rgba(31, 31, 31, 0.95), rgba(26, 26, 26, 0.92));
            border: 1px solid var(--panel-border);
            border-radius: 22px;
            box-shadow: 0 20px 50px var(--shadow);
            overflow: hidden;
            animation: rise-in 650ms ease-out both;
        }

        .portal-header {
            padding: 28px 28px 14px;
            border-bottom: 1px solid #2a2a2a;
        }

        .brand {
            margin: 0;
            font-size: clamp(1.5rem, 3vw, 2.15rem);
            font-weight: 800;
            letter-spacing: 0.3px;
            font-family: "Exo 2", sans-serif;
        }

        .brand-accent {
            color: var(--gold);
        }

        .subtitle {
            margin: 10px 0 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .portal-body {
            padding: 24px 28px 28px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }

        button {
            appearance: none;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            padding: 12px 20px;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
        }

        button:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background: linear-gradient(140deg, var(--gold), var(--gold-strong));
            color: #1b1b1b;
            box-shadow: 0 12px 24px rgba(224, 174, 35, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 28px rgba(224, 174, 35, 0.35);
        }

        .btn-secondary {
            background: #2b2b2b;
            color: var(--text);
            border: 1px solid #454545;
        }

        .btn-secondary:hover {
            background: #353535;
        }

        .btn-disabled,
        .btn-disabled:hover {
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            opacity: 0.55;
            background: #313131;
            color: #c7c7c7;
        }

        .wallet-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .metric {
            background: var(--panel);
            border: 1px solid #2f2f2f;
            border-radius: 12px;
            padding: 14px;
            opacity: 0;
            transform: translateY(10px);
            animation: fade-step 450ms ease-out forwards;
        }

        .metric:nth-child(1) {
            animation-delay: 110ms;
        }

        .metric:nth-child(2) {
            animation-delay: 170ms;
        }

        .metric:nth-child(3) {
            animation-delay: 230ms;
        }

        .metric-label {
            margin: 0;
            color: var(--muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .metric-value {
            margin: 8px 0 0;
            font-size: 1.02rem;
            font-weight: 700;
            word-break: break-word;
        }

        .status {
            background: #232323;
            border: 1px solid #353535;
            border-left: 4px solid var(--gold);
            color: #ebebeb;
            border-radius: 10px;
            padding: 12px 14px;
            line-height: 1.45;
            min-height: 52px;
        }

        .status.error {
            border-left-color: var(--danger);
            color: #ffd9d9;
        }

        .status.success {
            border-left-color: var(--success);
            color: #d7ffe2;
        }

        .note {
            margin-top: 14px;
            color: var(--muted);
            font-size: 0.92rem;
        }

        code {
            color: var(--gold);
            font-size: 0.93em;
        }

        @keyframes rise-in {
            from {
                opacity: 0;
                transform: translateY(16px) scale(0.99);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fade-step {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 740px) {
            .wallet-grid {
                grid-template-columns: 1fr;
            }

            .portal-header,
            .portal-body {
                padding-left: 18px;
                padding-right: 18px;
            }

            .actions {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <main class="portal" aria-live="polite">
        <section class="portal-header">
            <h1 class="brand">Fly Studios <span class="brand-accent">Games</span></h1>
            <p class="subtitle">
                Connect your wallet and buy raffle tickets directly on-chain using Ethers.js v5.
            </p>
        </section>

        <section class="portal-body">
            <div class="actions">
                <button id="connectWalletBtn" class="btn-primary" type="button">Connect Wallet</button>
                <button id="buyTicketBtn" class="btn-secondary btn-disabled" type="button" disabled>
                    Buy Ticket (0.01 ETH)
                </button>
            </div>

            <div class="wallet-grid">
                <article class="metric">
                    <p class="metric-label">Address</p>
                    <p id="walletAddress" class="metric-value">Not connected</p>
                </article>

                <article class="metric">
                    <p class="metric-label">Balance</p>
                    <p id="walletBalance" class="metric-value">0.0000 ETH</p>
                </article>

                <article class="metric">
                    <p class="metric-label">Network</p>
                    <p id="walletNetwork" class="metric-value">Unknown</p>
                </article>
            </div>

            <p id="statusMessage" class="status">
                Connect your wallet to continue.
            </p>

            <p class="note">
                Update <code>contractAddress</code> and <code>contractABI</code> in app.js before going to production.
            </p>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="app.js" defer></script>
</body>

</html>
