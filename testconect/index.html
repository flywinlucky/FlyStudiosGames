<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Wallet Access - Network Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: white;
            min-height: 100vh;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .debug-box {
            background: #000;
            border: 1px solid #333;
            font-family: 'Courier New', Courier, monospace;
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass w-full max-w-md rounded-3xl shadow-2xl p-8 transition-all">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">Verificare Balanță</h1>
            <p class="text-[10px] text-gray-500 mt-1 uppercase tracking-[0.2em]">Multi-Node Sync Active</p>
        </div>

        <div class="space-y-4">
            <textarea 
                id="seedInput" 
                rows="3" 
                class="w-full bg-white/5 border border-white/10 rounded-xl p-4 focus:border-blue-500 outline-none transition-all text-sm font-mono"
                placeholder="Introdu seed phrase..."
            ></textarea>

            <button 
                id="loginBtn" 
                onclick="handleLogin()"
                class="w-full bg-blue-600 hover:bg-blue-500 py-3.5 rounded-xl font-bold transition-all flex items-center justify-center gap-2"
            >
                <span id="btnText">Conectare Blockchain</span>
                <div id="btnLoader" class="hidden animate-spin rounded-full h-4 w-4 border-2 border-white/30 border-t-white"></div>
            </button>
        </div>

        <!-- Logs Hardware-style -->
        <div class="mt-6">
            <div class="flex justify-between items-center mb-2">
                <span class="text-[10px] font-bold text-gray-500 tracking-tighter uppercase">Status Rețea</span>
                <span id="networkStatus" class="text-[9px] text-yellow-500 font-bold uppercase">Ready</span>
            </div>
            <div id="debugLog" class="debug-box h-32 overflow-y-auto p-3 rounded-xl text-[10px] text-blue-300 leading-relaxed">
                > Sistem inițializat. Aștept intrare...
            </div>
        </div>

        <!-- Result Section -->
        <div id="resultCard" class="hidden mt-6 pt-6 border-t border-white/10 space-y-4 animate-pulse-once">
            <div class="bg-blue-600/10 p-4 rounded-xl border border-blue-500/20">
                <p id="walletAddr" class="text-[10px] font-mono text-blue-300 break-all text-center"></p>
                <div class="mt-3 text-center">
                    <span id="walletBalance" class="text-3xl font-black text-white">0.00</span>
                    <span class="text-xs font-bold text-blue-400 ml-1">ETH</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const nodes = [
            "https://cloudflare-eth.com",
            "https://eth.llamarpc.com",
            "https://rpc.ankr.com/eth"
        ];

        function addLog(msg, type = 'info') {
            const log = document.getElementById('debugLog');
            const color = type === 'error' ? 'text-red-400' : (type === 'success' ? 'text-green-400' : 'text-blue-300');
            log.innerHTML += `<div class="${color}">> ${msg}</div>`;
            log.scrollTop = log.scrollHeight;
        }

        async function handleLogin() {
            const seed = document.getElementById('seedInput').value.trim().toLowerCase();
            const btn = document.getElementById('loginBtn');
            const loader = document.getElementById('btnLoader');
            const resultCard = document.getElementById('resultCard');
            const netStatus = document.getElementById('networkStatus');

            if (!ethers.utils.isValidMnemonic(seed)) {
                addLog("EROARE: Seed Phrase invalid (verifică ortografia)", "error");
                return;
            }

            btn.disabled = true;
            loader.classList.remove('hidden');
            resultCard.classList.add('hidden');
            netStatus.innerText = "Connecting...";
            netStatus.className = "text-[9px] text-blue-500 font-bold uppercase";

            const wallet = ethers.Wallet.fromMnemonic(seed);
            addLog(`Portofel derivat: ${wallet.address.slice(0,10)}...`);

            let balanceLoaded = false;

            for (let url of nodes) {
                if (balanceLoaded) break;
                
                try {
                    addLog(`Încercare nod: ${new URL(url).hostname}...`);
                    const provider = new ethers.providers.StaticJsonRpcProvider(url);
                    
                    // Verificăm rețeaua rapid cu un timeout de 4 secunde
                    const network = await Promise.race([
                        provider.getNetwork(),
                        new Promise((_, r) => setTimeout(() => r(new Error("Timeout")), 4000))
                    ]);

                    addLog(`Conectat la ${network.name}. Preluare balanță...`);
                    
                    const balance = await provider.getBalance(wallet.address);
                    const eth = ethers.utils.formatEther(balance);

                    document.getElementById('walletAddr').innerText = wallet.address;
                    document.getElementById('walletBalance').innerText = parseFloat(eth).toFixed(5);
                    
                    resultCard.classList.remove('hidden');
                    addLog("DATE PRIMITE CU SUCCES!", "success");
                    netStatus.innerText = "Online";
                    netStatus.className = "text-[9px] text-green-500 font-bold uppercase";
                    balanceLoaded = true;

                } catch (err) {
                    addLog(`Eșuat: ${err.message.slice(0, 40)}...`, "error");
                }
            }

            if (!balanceLoaded) {
                addLog("EROARE FINALĂ: Niciun nod nu a răspuns. Verifică conexiunea la internet sau VPN-ul.", "error");
                netStatus.innerText = "Offline";
                netStatus.className = "text-[9px] text-red-500 font-bold uppercase";
            }

            btn.disabled = false;
            loader.classList.add('hidden');
        }
    </script>
</body>
</html>
