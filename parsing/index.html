<!DOCTYPE html>
<html lang="ro">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Vice City - Fullscreen Embed</title>
	<style>
		:root {
			color-scheme: dark;
		}

		html,
		body {
			width: 100%;
			height: 100%;
			margin: 0;
			background: #000;
			overflow: hidden;
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
		}

		#game-wrapper {
			position: fixed;
			inset: 0;
			width: 100vw;
			height: 100vh;
			background: #000;
		}

		#game-frame {
			width: 100%;
			height: 100%;
			border: 0;
			display: block;
			background: #000;
		}

		#controls {
			position: fixed;
			top: 12px;
			right: 12px;
			z-index: 10;
			display: flex;
			gap: 8px;
		}

		#fullscreen-btn {
			border: 0;
			border-radius: 10px;
			padding: 10px 14px;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			background: rgba(23, 34, 45, 0.86);
			color: #fff;
			backdrop-filter: blur(6px);
		}

		#fullscreen-btn:hover {
			background: rgba(41, 59, 77, 0.95);
		}

		#fullscreen-btn:focus-visible {
			outline: 2px solid #8ed0ff;
			outline-offset: 2px;
		}
	</style>
</head>
<body>
	<div id="controls">
		<button id="fullscreen-btn" type="button">Fullscreen</button>
	</div>

	<main id="game-wrapper" aria-label="Game container">
		<iframe
			id="game-frame"
			src="https://vc.quenq.com"
			title="Vice City"
			allow="accelerometer; autoplay; clipboard-read; clipboard-write; cross-origin-isolated; display-capture; encrypted-media; fullscreen; gamepad; geolocation; gyroscope; hid; keyboard-map; microphone; midi; picture-in-picture; screen-wake-lock; usb; web-share; xr-spatial-tracking"
			allowfullscreen
			referrerpolicy="strict-origin-when-cross-origin"
		></iframe>
	</main>

	<script>
		const fullscreenBtn = document.getElementById("fullscreen-btn");

		async function toggleFullscreen() {
			try {
				if (!document.fullscreenElement) {
					await document.documentElement.requestFullscreen();
					return;
				}

				await document.exitFullscreen();
			} catch (error) {
				console.error("Fullscreen request failed:", error);
			}
		}

		function refreshButtonLabel() {
			fullscreenBtn.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
		}

		fullscreenBtn.addEventListener("click", toggleFullscreen);
		document.addEventListener("fullscreenchange", refreshButtonLabel);
		refreshButtonLabel();
	</script>
</body>
</html>
